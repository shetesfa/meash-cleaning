services:
  - type: web
    name: meash-cleaning
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Meash Cleaning Solution"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: mysql
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "4000"
        sync: false
      - key: DB_DATABASE
        sync: false
      - key: DB_USERNAME
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: MYSQL_ATTR_SSL_CA
        value: "/etc/ssl/certs/ca-certificates.crt"
      - key: MYSQL_ATTR_SSL_VERIFY_SERVER_CERT
        value: "true"
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "meash_cleaning_solution_bot"
      - key: TELEGRAM_WEBHOOK_URL
        value: "https://meash-cleaning.onrender.com/api/telegram/webhook"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_MINIAPP_URL
        value: "https://shetesfa.github.io/meash-mini-app/"
      - key: MEASH_OWNER_NAME
        value: "Amha"
      - key: MEASH_OWNER_USERNAME
        value: "amha"
      - key: MEASH_OWNER_EMAIL
        value: "owner@meash.com"
      - key: MEASH_OWNER_PHONE
        value: "0970075509"
      - key: MEASH_OWNER_PASSWORD
        sync: false
      - key: MEASH_SEED_DEMO_DATA
        value: "false"
