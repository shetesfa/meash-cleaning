services:
  - type: web
    name: meash-cleaning
    runtime: docker
    plan: free
    region: frankfurt
    branch: main
    autoDeploy: true
    envVars:
      - key: APP_NAME
        value: "Meash Cleaning Solution"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_KEY
        generateValue: true
      - key: APP_URL
        sync: false
      - key: DB_CONNECTION
        value: sqlite
      - key: DB_DATABASE
        value: /var/www/html/database/database.sqlite
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        value: "meash_cleaning_solution_bot"
      - key: TELEGRAM_WEBHOOK_URL
        value: "https://meash-cleaning-gy5x.onrender.com/api/telegram/webhook"
      - key: TELEGRAM_WEBHOOK_SECRET
        generateValue: true
      - key: TELEGRAM_MINIAPP_URL
        value: "https://shetesfa.github.io/meash-mini-app/"
      - key: MEASH_OWNER_EMAIL
        value: "owner@meash.com"
      - key: MEASH_OWNER_PHONE
        value: "0970075509"
      - key: MEASH_OWNER_PASSWORD
        value: "Meash@Cleaning2026!"
      - key: MEASH_SEED_DEMO_DATA
        value: "false"
