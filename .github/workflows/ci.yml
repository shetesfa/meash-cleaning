name: CI Workflow - Meash Cleaning Production Audit

on:
  push:
    branches: [ production-hardening, main ]
  pull_request:
    branches: [ production-hardening, main ]

jobs:
  laravel-tests:
    name: PHPUnit & Security Tests (PHP 8.2)
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: meash_testing
        ports:
          - 3306:3306
        options: --health-cmd="mysqladmin ping" --health-interval=10s --health-timeout=5s --health-retries=5

    env:
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: meash_testing
      DB_USERNAME: root
      DB_PASSWORD: root
      MYSQL_ATTR_SSL_VERIFY_SERVER_CERT: "false"
      MYSQL_ATTR_SSL_CA: ""
      APP_ENV: testing
      BCRYPT_ROUNDS: 4
      CACHE_STORE: array
      SESSION_DRIVER: array
      QUEUE_CONNECTION: sync
      MAIL_MAILER: array

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, intl, pdo_sqlite, pdo_mysql, bcmath, curl
          coverage: none

      - name: Check Composer Validation
        run: composer validate --strict

      - name: Cache Composer Dependencies
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('**/composer.lock') }}
          restore-keys: ${{ runner.os }}-composer-

      - name: Install Composer Dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Prepare Laravel Environment
        run: |
          cp .env.example .env
          php artisan key:generate --force

      - name: Run Database Migrations
        run: php artisan migrate:fresh --force

      - name: Execute Full Test Suite
        run: php artisan test --colors=always

  frontend-build:
    name: Frontend Assets Build & Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build Production Assets
        run: npm run build
